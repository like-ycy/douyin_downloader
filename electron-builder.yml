# electron-builder 配置（自用分发，不签名公证）
# mac 产物: release/mac-<arch>/douyin_downloader.app —— 双击直接运行，无安装器
# win 产物: release/win-unpacked/ → 打成 zip 绿色版分发
#   解压一次后双击 douyin_downloader.exe 直接运行（免安装、秒开）
#   （portable 自解压格式每次启动解压 ~250MB 要 6-7s，已弃用；nsis 需安装，也不采用）
appId: com.wang.douyindownloader
productName: douyin_downloader
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
# 裁剪 Electron 自带语言包：win 版 locales 共 55 个文件 / 48.3MB，只留中英后剩 1.1MB，
# 解压体积直降 47.2MB（本项目界面纯中文，无 i18n 依赖，不影响功能）。
# ⚠️ 命名不可省：electron-builder 按「文件基名小写后精确比对」匹配（ElectronFramework.js），
#    Windows 是 zh-CN.pak / en-US.pak（连字符），macOS 是 zh_CN.lproj / en_US.lproj（下划线），
#    两套写法不通用；只写连字符版本会让 mac 侧的中文资源被静默删除、且不报错。
# 不想要英文兜底可删掉 en-US / en_US 两项，再省 0.56MB。
electronLanguages:
  - zh-CN
  - zh_CN
  - en-US
  - en_US
mac:
  category: public.app-category.video
  icon: build/icon.png
  # 自用不做正式签名；无证书时 electron-builder 自动 ad-hoc 签名
  # （Apple Silicon 必需，勿设 identity: null，否则跳过签名可能无法双击运行）
  target:
    - target: dir
win:
  icon: build/icon.png
  # dir 产出 win-unpacked/ 完整目录，由 CI/脚本打成 zip 分发
  target:
    - target: dir
