# electron-builder 配置（自用分发，不签名公证）
# mac 产物: release/mac-<arch>/douyin_downloader.app —— 双击直接运行，无安装器
# win 产物: release/douyin_downloader-<version>.exe —— portable 免安装，双击直接运行
appId: com.wang.douyindownloader
productName: douyin_downloader
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
mac:
  category: public.app-category.video
  icon: build/icon.png
  # 自用不做正式签名；无证书时 electron-builder 自动 ad-hoc 签名
  # （Apple Silicon 必需，勿设 identity: null，否则跳过签名可能无法双击运行）
  target:
    - target: dir
win:
  icon: build/icon.png
  target:
    - target: portable
