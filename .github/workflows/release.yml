name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            args: --arm64
          - arch: x64
            args: --x64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set application version (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.GITHUB_REF_NAME.slice(1);fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npx electron-vite build

      - name: Package .app (macOS ${{ matrix.arch }})
        run: npx electron-builder --mac dir ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # CI 上无证书会跳过签名，遗留的 Electron linker 签名与资源不符，
      # 可能无法启动 —— 强制 ad-hoc 签名（Apple Silicon 必需）
      # 注意 electron-builder 输出目录：arm64 -> mac-arm64，x64 -> mac（无后缀）
      - name: Ad-hoc code sign
        run: |
          APP_DIR=$(find release -maxdepth 1 -type d -name 'mac*' | head -1)
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          APP="$APP_DIR/douyin_downloader.app"
          codesign --force --deep -s - "$APP"
          codesign --verify "$APP"

      - name: Package tar.gz (保留 .app 符号链接与可执行权限)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -d "$APP_DIR/douyin_downloader.app" || { echo "missing .app"; ls -R release; exit 1; }
          tar -czf "douyin_downloader_${VERSION}_macos_${{ matrix.arch }}.app.tar.gz" -C "$APP_DIR" douyin_downloader.app
          test -f "douyin_downloader_${VERSION}_macos_${{ matrix.arch }}.app.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: douyin_downloader_*.app.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set application version (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.GITHUB_REF_NAME.slice(1);fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npx electron-vite build

      - name: Package portable dir
        run: npx electron-builder --win dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package zip
        shell: pwsh
        run: |
          $VERSION = (Get-Content package.json | ConvertFrom-Json).version
          if (-not (Test-Path "release/win-unpacked/douyin_downloader.exe")) { throw "missing win-unpacked exe" }
          # 压缩整个目录，解压后得到 win-unpacked 文件夹，双击其中 exe 直接运行
          Compress-Archive -Path "release/win-unpacked" -DestinationPath "douyin_downloader_${VERSION}_windows_amd64.zip" -Force
          if (-not (Test-Path "douyin_downloader_${VERSION}_windows_amd64.zip")) { throw "failed to create zip" }

      - uses: actions/upload-artifact@v6
        with:
          name: windows-amd64
          path: douyin_downloader_*_windows_amd64.zip
          if-no-files-found: error

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )
          echo "SHA256SUMS:"
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(release-assets/*)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "douyin-downloader $GITHUB_REF_NAME" \
              --generate-notes
          fi
